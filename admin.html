  html+='<div class="grid">'+keys.map(function(k){
    var isColor=/^color_/.test(k);
    var label=SETTINGS_LABELS[k]||k;
    return '<div><label>'+esc(label)+'</label><input data-set="'+esc(k)+'" '+(isColor?'type="color"':'')+' value="'+esc(m[k])+'"></div>';
  }).join('')+'</div>';
  html+='<h4 style="margin-top:16px">Ajouter un autre réglage</h4>'+
    '<label>Nom de la clé (ex. telephone, email, color_principale)</label><input id="newSetKey">'+
    '<label>Valeur</label><input id="newSetVal">'+
    '<p><button class="ghost" id="addSet">Ajouter ce champ</button></p>'+
    '<p><button class="primary" id="saveSet">Enregistrer</button></p></div>';
  return html;
}
function textsView(){
  var over={}; (site.texts||[]).forEach(function(r){over[r.tkey]=r.value;});
  var html='<div class="card"><h3>Textes du site</h3><p><small class="hint">Voici les textes déjà affichés sur le site, page par page. Modifiez-les puis cliquez sur Enregistrer — le reste garde sa valeur actuelle.</small></p>';
  PAGE_ORDER.forEach(function(pg){
    var ks=Object.keys(DEFAULT_TEXTS).filter(function(k){return k.indexOf(pg+'.')===0;});
    if(!ks.length) return;
    html+='<h4 style="margin-top:20px;border-top:1px solid var(--bd);padding-top:14px">'+esc(PAGE_LABELS[pg]||pg)+'</h4>';
    html+=ks.map(function(k){
      var val=(over[k]!==undefined)?over[k]:DEFAULT_TEXTS[k];
      return '<label><small class="hint">'+esc(k)+'</small></label><textarea data-text="'+esc(k)+'">'+esc(val)+'</textarea>';
    }).join('');
  });
  var extra=Object.keys(over).filter(function(k){return !(k in DEFAULT_TEXTS);});
  if(extra.length){
    html+='<h4 style="margin-top:20px;border-top:1px solid var(--bd);padding-top:14px">Autres textes ajoutés</h4>';
    extra.forEach(function(k){html+='<label><small class="hint">'+esc(k)+'</small></label><textarea data-text="'+esc(k)+'">'+esc(over[k])+'</textarea>';});
  }
  html+='<h4 style="margin-top:16px">Ajouter un autre texte</h4>'+
    '<label>Clé du texte</label><input id="newTxtKey">'+
    '<label>Contenu</label><textarea id="newTxtVal"></textarea>'+
    '<p><button class="ghost" id="addTxt">Ajouter ce champ</button></p>'+
    '<p><button class="primary" id="saveTxt">Enregistrer</button></p></div>';
  return html;
}
function mediaName(m){ return m.title || (m.mkey? (SLOTS[m.mkey]? SLOTS[m.mkey].label : m.mkey) : m.path.split('/').pop()); }
function mediaCard(m){ if(m._empty) return '<div class="media"><div style="height:130px;border-radius:8px;background:#eef2f8;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px"><small class="hint">Image d\'origine du site</small></div><p><b>'+esc(mediaName(m))+'</b></p><p><button class="primary" data-mrep="'+m.mkey+'" data-mid="" style="width:100%">Remplacer par une image ou vidéo</button></p></div>';
  var url=MEDIA+m.path;
  var pages=(m.mkey&&SLOT_PAGES[m.mkey])?SLOT_PAGES[m.mkey].join(', '):'';
  return '<div class="media">'+(m.kind==='video'?'<video src="'+url+'" muted loop playsinline controls></video>':'<img src="'+url+'" alt="">')+
   '<p style="margin:8px 0 2px"><b>'+esc(mediaName(m))+'</b></p>'+
   '<small class="hint">'+(pages?'Pages : '+esc(pages):(m.mkey?'Présent sur tout le site':'Média ajouté'))+(m.kind==='video'?' • vidéo':'')+'</small>'+
   '<label>Titre</label><input data-mt="'+m.id+'" value="'+esc(m.title)+'">'+
   '<label>Sous-titre</label><input data-ms="'+m.id+'" value="'+esc(m.subtitle)+'">'+
   '<p><button class="primary" data-mrep="'+(m.mkey||'')+'" data-mid="'+m.id+'" style="width:100%">Remplacer par une image ou vidéo</button></p>'+
   '<p><button class="ghost" data-msave="'+m.id+'">Enregistrer</button>'+
   (m.mkey?'':' <button class="ghost" data-mdel="'+m.id+'">Supprimer</button>')+'</p></div>';
}
function mediaView(){
  var all=(site.media||[]).slice();
  Object.keys(SLOTS).forEach(function(k){ if(!all.some(function(m){return m.mkey===k;})) all.push({id:'',mkey:k,path:'',kind:'image',title:'',subtitle:'',_empty:true}); });
  var extras=all.filter(function(m){return !m.mkey;});
  var html='<div class="card"><h3>Ajouter un média</h3><label>Fichier (image JPG/PNG ou vidéo MP4/WebM)</label><input type="file" id="newFile" accept="image/*,video/mp4,video/webm,video/*">'+
   '<label>Titre</label><input id="newTitle"><label>Sous-titre</label><input id="newSub">'+
   '<p><button class="primary" id="addMedia">Téléverser</button></p>'+
   '<small class="hint">Les médias ajoutés peuvent être insérés dans vos pages depuis l\'onglet « Pages ».</small></div>';
  html+='<div class="card"><h3>Médias ajoutés</h3>'+(extras.length?'<div class="grid">'+extras.map(mediaCard).join('')+'</div>':'<p><small class="hint">Aucun média ajouté.</small></p>')+'</div>';
  SECTIONS.forEach(function(sec){
    var items=all.filter(function(m){return m.mkey && (SLOTS[m.mkey]?SLOTS[m.mkey].section:'Autres')===sec;});
    if(!items.length) return;
    items.sort(function(a,b){return mediaName(a)<mediaName(b)?-1:1;});
    html+='<div class="card"><h3>'+esc(sec)+'</h3><div class="grid">'+items.map(mediaCard).join('')+'</div></div>';
  });
  return html;
}
function adminsView(){
  var html='<div class="card"><h3>Ajouter un administrateur</h3><label>Adresse e-mail</label><input id="naEmail" type="email">'+
   '<label>Mot de passe (6 caractères minimum)</label><input id="naPwd">'+
   '<p><button class="primary" id="naAdd">Ajouter</button></p></div>';
  html+='<div class="card"><h3>Administrateurs existants</h3>'+(admins.length?admins.map(function(a){
    return '<div data-adm="'+a.id+'" style="border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px">'+
      '<label>Adresse e-mail'+(a.id===meId?' (vous)':'')+'</label><input data-ae value="'+esc(a.email)+'">'+
      '<label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input data-ap value="">'+
      '<p><button class="primary" data-asave="'+a.id+'">Enregistrer</button> '+
      '<button class="ghost" data-adel="'+a.id+'">Supprimer</button></p></div>';
  }).join(''):'<p><small class="hint">Chargement…</small></p>')+'</div>';
  return html;
}
function pagesView(){
  return '<div class="card"><h3>Nouvelle page</h3>'+pageForm({})+'</div>'+
    (site.pages||[]).map(function(p){return '<div class="card">'+pageForm(p)+'</div>';}).join('');
}
function pageForm(p){
  var id=p.id||'';
  return '<div data-page="'+id+'">'+
    '<label>Nom dans le menu</label><input data-f="label" value="'+esc(p.label)+'">'+
    '<label>Adresse (facultatif)</label><input data-f="slug" value="'+esc(p.slug)+'">'+
    '<label>Titre</label><input data-f="title" value="'+esc(p.title)+'">'+
    '<label>Introduction</label><textarea data-f="intro">'+esc(p.intro)+'</textarea>'+
    '<label>Contenu</label><textarea data-f="body" style="min-height:160px">'+esc(p.body)+'</textarea>'+
    '<label>Insérer une image ou une vidéo dans le contenu</label><p>'+(site.media||[]).map(function(m){
      return '<button class="ghost" data-ins="'+m.id+'">'+(m.kind==='video'?'🎬 ':'🖼 ')+esc(mediaName(m))+'</button> ';
    }).join('')+'</p>'+
    '<label>Média d\'en-tête</label><select data-f="image_key"><option value="">Aucun</option>'+
      (site.media||[]).map(function(m){var v=m.mkey||m.id;
        return '<option value="'+esc(v)+'"'+((p.image_key||'')===v?' selected':'')+'>'+esc(mediaName(m))+(m.kind==='video'?' (vidéo)':'')+'</option>';}).join('')+
    '</select>'+
    '<label>Position dans le menu</label><input data-f="position" type="number" value="'+(p.position==null?100:p.position)+'">'+
    '<label><input data-f="visible" type="checkbox" style="width:auto" '+(p.visible===false?'':'checked')+'> Visible</label>'+
    '<p><button class="primary" data-psave="'+id+'">Enregistrer</button> '+(id?'<button class="ghost" data-pdel="'+id+'">Supprimer</button>':'')+'</p></div>';
}
function fileToB64(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.readAsDataURL(f);});}
function bindInsert(){
  document.querySelectorAll('[data-ins]').forEach(function(b){b.onclick=function(){
    var ta=b.closest('[data-page]').querySelector('[data-f="body"]');
    ta.value=ta.value.replace(/\s*$/,'')+'\n\n[[media:'+b.getAttribute('data-ins')+']]\n\n';
    toast('Média inséré — pensez à enregistrer.');};});
}
function bind(){
  var s=document.getElementById('saveSet');
  if(s) s.onclick=async function(){var e={};document.querySelectorAll('[data-set]').forEach(function(i){e[i.getAttribute('data-set')]=i.value;});
    var r=await call('saveSettings',{entries:e});toast(r.ok?'Enregistré':(r.message||'Erreur'));await load();};
  var t=document.getElementById('saveTxt');
  if(t) t.onclick=async function(){var e={};document.querySelectorAll('[data-text]').forEach(function(i){e[i.getAttribute('data-text')]=i.value;});
    var r=await call('saveTexts',{entries:e});toast(r.ok?'Enregistré':(r.message||'Erreur'));};
  var as=document.getElementById('addSet');
  if(as) as.onclick=function(){
    var k=(document.getElementById('newSetKey').value||'').trim();
    if(!k){toast('Indiquez un nom de clé');return;}
    site.settings=site.settings||[];
    site.settings.push({key:k,value:document.getElementById('newSetVal').value||''});
    render();
    toast('Champ ajouté — pensez à Enregistrer');
  };
  var at=document.getElementById('addTxt');
  if(at) at.onclick=function(){
    var k=(document.getElementById('newTxtKey').value||'').trim();
    if(!k){toast('Indiquez une clé');return;}
    site.texts=site.texts||[];
    site.texts.push({tkey:k,value:document.getElementById('newTxtVal').value||''});
    render();
    toast('Texte ajouté — pensez à Enregistrer');
  };
  var np=document.getElementById('npBtn');
  if(np) np.onclick=async function(){var r=await call('changePassword',{next:document.getElementById('np').value});
    if(r.ok){pw=document.getElementById('np').value;toast('Mot de passe modifié');}else toast(r.message||'Erreur');};
  var na=document.getElementById('naAdd');
  if(na) na.onclick=async function(){
    var r=await call('saveAdmin',{email:document.getElementById('naEmail').value,password:document.getElementById('naPwd').value});
    toast(r.ok?'Administrateur ajouté':(r.message||'Erreur')); if(r.ok) await load();};
  document.querySelectorAll('[data-asave]').forEach(function(b){b.onclick=async function(){
    var box=b.closest('[data-adm]');
    var r=await call('saveAdmin',{id:b.getAttribute('data-asave'),email:box.querySelector('[data-ae]').value,password:box.querySelector('[data-ap]').value});
    toast(r.ok?'Administrateur mis à jour':(r.message||'Erreur')); if(r.ok) await load();};});
  document.querySelectorAll('[data-adel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer cet administrateur ?'))return;
    var r=await call('deleteAdmin',{id:b.getAttribute('data-adel')});
    toast(r.ok?'Administrateur supprimé':(r.message||'Erreur')); if(r.ok) await load();};});
  var am=document.getElementById('addMedia');
  if(am) am.onclick=async function(){
    var f=document.getElementById('newFile').files[0]; if(!f){toast('Choisissez un fichier');return;}
    toast('Téléversement…');
    var r=await call('upload',{filename:f.name,base64:await fileToB64(f),contentType:f.type,kind:f.type.indexOf('video')===0?'video':'image',
      title:document.getElementById('newTitle').value,subtitle:document.getElementById('newSub').value});
    toast(r.ok?'Média ajouté':(r.message||'Erreur'));await load();};
  document.querySelectorAll('[data-msave]').forEach(function(b){b.onclick=async function(){
    var id=b.getAttribute('data-msave');
    var r=await call('saveMedia',{id:id,title:document.querySelector('[data-mt="'+id+'"]').value,subtitle:document.querySelector('[data-ms="'+id+'"]').value});
    toast(r.ok?'Enregistré':(r.message||'Erreur'));};});
  document.querySelectorAll('[data-mdel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer ce média ?'))return;var r=await call('deleteMedia',{id:b.getAttribute('data-mdel')});
    toast(r.ok?'Supprimé':(r.message||'Erreur'));await load();};});
  document.querySelectorAll('[data-mrep]').forEach(function(b){b.onclick=function(){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*,video/mp4,video/webm,video/*';
    inp.onchange=async function(){var f=inp.files[0];if(!f)return;toast('Téléversement…');
      var mkey=b.getAttribute('data-mrep');
      var isVid=f.type.indexOf('video')===0;
      var r=await call('upload',{filename:f.name,base64:await fileToB64(f),contentType:f.type,kind:isVid?'video':'image',
        mkey:mkey||null,mediaId:mkey?null:b.getAttribute('data-mid')});
      toast(r.ok?(isVid?'Vidéo publiée':'Image remplacée'):(r.message||'Erreur'));await load();};
    inp.click();};});
  document.querySelectorAll('[data-psave]').forEach(function(b){b.onclick=async function(){
    var box=b.closest('[data-page]');var p={};
    box.querySelectorAll('[data-f]').forEach(function(i){var k=i.getAttribute('data-f');
      p[k]= i.type==='checkbox'? i.checked : (k==='position'? Number(i.value||100) : i.value);});
    if(box.getAttribute('data-page')) p.id=box.getAttribute('data-page');
    if(!p.slug) p.slug=p.label;
    p.image_key=p.image_key||null;
    var r=await call('savePage',{page:p});toast(r.ok?'Page enregistrée':(r.message||'Erreur'));await load();};});
  document.querySelectorAll('[data-pdel]').forEach(function(b){b.onclick=async function(){
    if(!confirm('Supprimer cette page ?'))return;var r=await call('deletePage',{id:b.getAttribute('data-pdel')});
    toast(r.ok?'Page supprimée':(r.message||'Erreur'));await load();};});
  bindInsert();
}
</script>
</body>
</html>
